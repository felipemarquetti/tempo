<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FasTrain — Painel de Monitoramento de Frota</title>
<link rel="icon" href="assets/logo-light.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <!-- ============================================================
       1. SPLASH
       ============================================================ -->
  <section id="screen-splash" class="screen active theme-light">
    <div class="auth-screen">
      <div class="logo-wrap"><img src="assets/logo-light.png" alt="FasTrain"/></div>
      <p class="tagline">Shaping the future together.</p>
      <div class="splash-dots">
        <span class="active"></span><span></span><span></span><span></span>
      </div>
    </div>
  </section>

  <!-- ============================================================
       2. LANDING (Login / Sign up) — DARK
       ============================================================ -->
  <section id="screen-landing" class="screen theme-dark">
    <div class="auth-screen">
      <div class="a11y-buttons">
        <button aria-label="Contraste"><span data-icon="eye"></span></button>
      </div>
      <div class="logo-wrap"><img src="assets/logo-dark.png" alt="FasTrain"/></div>
      <div class="divider" style="max-width:220px;margin:26px auto"></div>
      <div class="auth-card">
        <button class="btn btn-ghost-light" onclick="go('login')">Login</button>
        <button class="btn btn-primary" onclick="go('signup')">Sign Up</button>
      </div>
    </div>
  </section>

  <!-- ============================================================
       3. LOGIN — LIGHT
       ============================================================ -->
  <section id="screen-login" class="screen theme-light">
    <div class="auth-screen">
      <button class="auth-back" onclick="go('landing')">‹ BACK</button>
      <div class="logo-wrap"><img src="assets/logo-light.png" alt="FasTrain"/></div>
      <form class="auth-card" style="margin-top:20px" data-goto="home">
        <div class="field">
          <input type="text" placeholder="Username" required />
          <span class="icon"><span data-icon="user"></span></span>
        </div>
        <div class="field">
          <input type="password" id="login-pass" placeholder="Enter Password" required />
          <span class="icon clickable" onclick="togglePassword('login-pass', this)"><span data-icon="eye"></span></span>
        </div>
        <button type="submit" class="btn btn-primary">Enter</button>
        <a href="#" class="link-line" onclick="go('forgot');return false;">Forgot password?</a>
        <div class="divider"></div>
        <div class="social-row">
          <div class="social-pill">
            <button type="button" aria-label="Entrar com Facebook"><span data-icon="fb"></span></button>
            <button type="button" aria-label="Entrar com Google"><span data-icon="google"></span></button>
          </div>
        </div>
      </form>
    </div>
  </section>

  <!-- ============================================================
       4. FORGOT PASSWORD — DARK
       ============================================================ -->
  <section id="screen-forgot" class="screen theme-dark">
    <div class="auth-screen">
      <button class="auth-back" onclick="go('login')">‹ BACK</button>
      <div class="logo-wrap"><img src="assets/logo-dark.png" alt="FasTrain"/></div>
      <form class="auth-card" style="margin-top:20px" data-goto="login">
        <div class="field">
          <input type="email" placeholder="Email" required />
          <span class="icon"><span data-icon="mail"></span></span>
        </div>
        <button type="submit" class="btn btn-primary">Send code</button>
      </form>
    </div>
  </section>

  <!-- ============================================================
       5. SIGN UP (pessoal) — LIGHT
       ============================================================ -->
  <section id="screen-signup" class="screen theme-light">
    <div class="auth-screen">
      <button class="auth-back" onclick="go('landing')">‹ BACK</button>
      <div class="logo-wrap"><img src="assets/logo-light.png" alt="FasTrain"/></div>
      <form class="auth-card" style="margin-top:20px" data-goto="home">
        <div class="field">
          <input type="text" placeholder="Name" required />
          <span class="icon"><span data-icon="user"></span></span>
        </div>
        <div class="field">
          <input type="email" placeholder="Email" required />
          <span class="icon"><span data-icon="mail"></span></span>
        </div>
        <div class="field">
          <input type="password" id="signup-pass" placeholder="Enter Password" required />
          <span class="icon clickable" onclick="togglePassword('signup-pass', this)"><span data-icon="eye"></span></span>
        </div>
        <div class="field">
          <input type="password" id="signup-pass2" placeholder="Confirm Password" required />
          <span class="icon clickable" onclick="togglePassword('signup-pass2', this)"><span data-icon="eye"></span></span>
        </div>
        <button type="submit" class="btn btn-primary">Create account</button>
        <a href="#" class="link-line" onclick="go('signup-company');return false;">register as a company</a>
        <div class="divider"></div>
        <div class="social-row">
          <div class="social-pill">
            <button type="button" aria-label="Entrar com Facebook"><span data-icon="fb"></span></button>
            <button type="button" aria-label="Entrar com Google"><span data-icon="google"></span></button>
          </div>
        </div>
      </form>
    </div>
  </section>

  <!-- ============================================================
       6. SIGN UP (empresa) — DARK
       ============================================================ -->
  <section id="screen-signup-company" class="screen theme-dark">
    <div class="auth-screen">
      <button class="auth-back" onclick="go('signup')">‹ BACK</button>
      <div class="logo-wrap"><img src="assets/logo-dark.png" alt="FasTrain"/></div>
      <form class="auth-card" style="margin-top:20px" data-goto="home">
        <div class="field">
          <input type="text" placeholder="Name" required />
          <span class="icon"><span data-icon="user"></span></span>
        </div>
        <div class="field">
          <input type="email" placeholder="Email" required />
          <span class="icon"><span data-icon="mail"></span></span>
        </div>
        <div class="field">
          <input type="text" placeholder="CNPJ" required />
          <span class="icon"><span data-icon="doc"></span></span>
        </div>
        <div class="field">
          <input type="password" id="signupc-pass" placeholder="Enter Password" required />
          <span class="icon clickable" onclick="togglePassword('signupc-pass', this)"><span data-icon="eye"></span></span>
        </div>
        <div class="field">
          <input type="password" id="signupc-pass2" placeholder="Confirm Password" required />
          <span class="icon clickable" onclick="togglePassword('signupc-pass2', this)"><span data-icon="eye"></span></span>
        </div>
        <button type="submit" class="btn btn-primary">Create account</button>
        <p class="hint-warning"><span data-icon="alert"></span> ATTENTION! For businesses only.</p>
      </form>
    </div>
  </section>

  <!-- ============================================================
       7. HOME / DASHBOARD — LIGHT
       ============================================================ -->
  <section id="screen-home" class="screen theme-light">
    <div id="shell-home" class="app-shell">
      <div class="sidebar-overlay" onclick="closeSidebar()"></div>
      <nav class="sidebar js-sidebar"></nav>
      <div class="main-area">
        <header class="topbar js-topbar"></header>
        <main class="page-content">
          <h1 class="page-title">Início</h1>
          <div id="home-body"></div>
        </main>
      </div>
    </div>
  </section>

  <!-- ============================================================
       8. TRIPS (List / Maps) — DARK
       ============================================================ -->
  <section id="screen-trips" class="screen theme-dark">
    <div id="shell-trips" class="app-shell">
      <div class="sidebar-overlay" onclick="closeSidebar()"></div>
      <nav class="sidebar js-sidebar"></nav>
      <div class="main-area">
        <header class="topbar js-topbar"></header>
        <main class="page-content">
          <h1 class="page-title">Trens em trânsito</h1>
          <div id="trips-body"></div>
        </main>
      </div>
    </div>
  </section>

  <!-- ============================================================
       8b. TRAIN DETAIL (mapa da rota) — LIGHT
       ============================================================ -->
  <section id="screen-train-detail" class="screen theme-light">
    <div id="shell-train-detail" class="app-shell">
      <div class="sidebar-overlay" onclick="closeSidebar()"></div>
      <nav class="sidebar js-sidebar"></nav>
      <div class="main-area">
        <header class="topbar js-topbar"></header>
        <main class="page-content">
          <div id="train-detail-body"></div>
        </main>
      </div>
    </div>
  </section>

  <!-- ============================================================
       9. PROFILE — DARK
       ============================================================ -->
  <section id="screen-profile" class="screen theme-dark">
    <div id="shell-profile" class="app-shell">
      <div class="sidebar-overlay" onclick="closeSidebar()"></div>
      <nav class="sidebar js-sidebar"></nav>
      <div class="main-area">
        <header class="topbar js-topbar"></header>
        <main class="page-content">
          <h1 class="page-title">Perfil</h1>
          <div id="profile-body"></div>
        </main>
      </div>
    </div>
  </section>

  <!-- ============================================================
       10. TRAINS (gestão de frota) — LIGHT
       ============================================================ -->
  <section id="screen-trains" class="screen theme-light">
    <div id="shell-trains" class="app-shell">
      <div class="sidebar-overlay" onclick="closeSidebar()"></div>
      <nav class="sidebar js-sidebar"></nav>
      <div class="main-area">
        <header class="topbar js-topbar"></header>
        <main class="page-content">
          <h1 class="page-title">Train list</h1>
          <div id="trains-body"></div>
        </main>
      </div>
    </div>
  </section>

  <!-- ============================================================
       11. SENSORS — DARK
       ============================================================ -->
  <section id="screen-sensors" class="screen theme-dark">
    <div id="shell-sensors" class="app-shell">
      <div class="sidebar-overlay" onclick="closeSidebar()"></div>
      <nav class="sidebar js-sidebar"></nav>
      <div class="main-area">
        <header class="topbar js-topbar"></header>
        <main class="page-content">
          <div id="sensors-body"></div>
        </main>
      </div>
    </div>
  </section>

  <!-- ============================================================
       12. NOTIFICATIONS — LIGHT
       ============================================================ -->
  <section id="screen-notifications" class="screen theme-light">
    <div id="shell-notifications" class="app-shell">
      <div class="sidebar-overlay" onclick="closeSidebar()"></div>
      <nav class="sidebar js-sidebar"></nav>
      <div class="main-area">
        <header class="topbar js-topbar"></header>
        <main class="page-content">
          <h1 class="page-title">Notificações</h1>
          <div id="notifications-body"></div>
        </main>
      </div>
    </div>
  </section>

</div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
